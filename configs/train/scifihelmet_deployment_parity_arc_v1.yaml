schema_version: 1
experiment: deployment_parity_arc_v1
inputs:
  gltf: assets/source/glTF-Sample-Assets/Models/SciFiHelmet/glTF/SciFiHelmet.gltf
  core4_manifest: configs/assets/scifihelmet_core4.yaml
  core4_dir: assets/processed/SciFiHelmet/core4
candidates:
  dp_relu_fresh:
    decoder_width: 8
    activation_region_weight: 0.0
    output_dir: outputs/compression/scifihelmet/deployment_parity_arc_v1/dp_relu_fresh
  arc_relu_fresh:
    decoder_width: 8
    activation_region_weight: 0.5
    output_dir: outputs/compression/scifihelmet/deployment_parity_arc_v1/arc_relu_fresh
  arc12_diagnostic:
    decoder_width: 12
    activation_region_weight: 0.5
    output_dir: outputs/compression/scifihelmet/deployment_parity_arc_v1/arc12_diagnostic
render:
  resolution: [256, 256]
  camera_radius: 4.5
  target: [0.0, 0.0, 0.0]
  up: [0.0, 1.0, 0.0]
  vertical_fov_degrees: 45.0
  near: 0.1
  far: 10.0
  minimum_roughness: 0.045
  display_exposure: 1.5
  linear_psnr_data_range: 2.0
training:
  seed: 20260804
  split_seed: 20260803
  batch_size: 8180
  max_steps: 120000
  max_minutes: 120
  enforce_time_limit: false
  preflight_steps: 1000
  fixed_probe_interval: 1000
  full_atlas_evaluation_interval: 5000
  log_interval: 100
  decode_chunk_size: 262144
  selection_render_case_limit: 3
  dark_hard_pool_top_fraction: 0.25
  underprediction_top_fraction: 0.05
  dark_pool_phase_xy: [0.25, 0.25]
  latent_clamp_epsilon: 0.000001
  dtype: float32
  amp: false
  optimizer: Adam
  optimizer_implementation: fused_cuda_direct_unorm
  schedule:
    warmup_end_step: 5000
    warmup_latent_lr: 0.02
    warmup_decoder_lr: 0.001
    cosine_end_step: 100000
    cosine_latent_lr: 0.002
    cosine_decoder_lr: 0.0001
    polish_end_step: 120000
    polish_latent_lr: 0.0005
    polish_decoder_lr: 0.00002
batch_mix:
  visible_screen_subpixel: 0.40
  uniform_atlas_subpixel: 0.20
  D2_D3_dark_hard_cell: 0.15
  material_boundary_halo_cell: 0.15
  texel_center_reference_anchor: 0.10
loss:
  subpixel_reference_material: 0.5
  postprocess_filter_commutativity: 0.5
  luminance_underprediction_top_tail: 0.5
  metallic_boundary_halo: 0.25
  texel_center_reference_anchor: 0.5
  dark_envelope: 0.5
  activation_region: 0.5
  activation_region_margin: 0.00784313725490196
material_channels:
  base_color_l1: 1.0
  normal_cosine: 1.0
  roughness_l1: 0.5
  metallic_l1: 0.5
scopes:
  D2_yellow_tube: [1664, 0, 2048, 512]
  D3_gray_panel: [1024, 512, 1664, 1152]
train_cameras:
  - {name: train_e0_y000, elevation_degrees: 0.0, yaw_degrees: 0.0}
  - {name: train_e0_y045, elevation_degrees: 0.0, yaw_degrees: 45.0}
  - {name: train_e0_y090, elevation_degrees: 0.0, yaw_degrees: 90.0}
  - {name: train_e0_y135, elevation_degrees: 0.0, yaw_degrees: 135.0}
  - {name: train_e0_y180, elevation_degrees: 0.0, yaw_degrees: 180.0}
  - {name: train_e0_y225, elevation_degrees: 0.0, yaw_degrees: 225.0}
  - {name: train_e0_y270, elevation_degrees: 0.0, yaw_degrees: 270.0}
  - {name: train_e0_y315, elevation_degrees: 0.0, yaw_degrees: 315.0}
  - {name: train_ep20_y000, elevation_degrees: 20.0, yaw_degrees: 0.0}
  - {name: train_ep20_y090, elevation_degrees: 20.0, yaw_degrees: 90.0}
  - {name: train_ep20_y180, elevation_degrees: 20.0, yaw_degrees: 180.0}
  - {name: train_ep20_y270, elevation_degrees: 20.0, yaw_degrees: 270.0}
  - {name: train_em15_y045, elevation_degrees: -15.0, yaw_degrees: 45.0}
  - {name: train_em15_y135, elevation_degrees: -15.0, yaw_degrees: 135.0}
  - {name: train_em15_y225, elevation_degrees: -15.0, yaw_degrees: 225.0}
  - {name: train_em15_y315, elevation_degrees: -15.0, yaw_degrees: 315.0}
  - {name: train_em30_y090, elevation_degrees: -30.0, yaw_degrees: 90.0}
  - {name: train_em30_y270, elevation_degrees: -30.0, yaw_degrees: 270.0}
  - {name: train_ep35_y225, elevation_degrees: 35.0, yaw_degrees: 225.0}
train_lights:
  - {name: front_right, position: [2.5, 3.0, 4.0], color: [1.0, 0.98, 0.95], radiant_intensity: 90.0, ambient_intensity: 0.04}
  - {name: front_left, position: [-2.5, 3.0, 4.0], color: [0.95, 0.98, 1.0], radiant_intensity: 90.0, ambient_intensity: 0.04}
  - {name: rear_top, position: [0.0, 4.0, -3.5], color: [1.0, 0.96, 0.92], radiant_intensity: 80.0, ambient_intensity: 0.04}
