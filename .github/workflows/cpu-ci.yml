name: cpu-ci

on:
  push:
    branches: [main, "aster/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Audit public repository surface
        run: python scripts/audit_public_repo.py
      - name: Run CPU tests
        run: python -m pytest -m "not gpu and not ue and not asset"
